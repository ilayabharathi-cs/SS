# ==============================================================================
# SmartShield IoT Security — Snort 3 Configuration
# ==============================================================================

# Define HOME_NET for the authorized lab environment
HOME_NET = '192.168.43.0/24'
EXTERNAL_NET = '!$HOME_NET'

# Ports configuration
HTTP_PORTS = '80, 8000'

# Snort Inspection Engine Settings
stream = {}
stream_ip = {}
stream_icmp = {}
stream_tcp = {}
stream_udp = {}

# Snort Inspector Modules
ips = {
    include = 'rules/smartshield.rules'
}

# Alert Output Configuration
logger = {
    alert_json = {
        file = true,
        limit = 100,
        fields = 'timestamp action class bssid src_addr src_port dst_addr dst_port proto msg sid rev'
    }
}
